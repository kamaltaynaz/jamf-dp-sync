<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The nightly run, per app</title>
<desc id="d">Six steps: check the newest version in Jamf's patch catalogue and stop if the policy already has it; download the vendor's signed pkg once on the server; verify size, hash, pkg structure, signing Team ID and version; publish it to the distribution point's Packages folder; update Jamf with the package record, policy swap and patch title mapping; new Macs then install it from the local network.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker></defs>
<line x1="296" y1="76" x2="320" y2="76" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="76" x2="624" y2="76" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="296" y1="224" x2="320" y2="224" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="224" x2="624" y2="224" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<path d="M764 136 V150 H156 V164" fill="none" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="20" width="272" height="112" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="46" cy="48" r="12" fill="#4493f8"/>
<text x="46" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text>
<text x="68" y="53" font-size="16" font-weight="700" fill="#f0f6fc">Check</text>
<text x="36" y="80" font-size="13.5" fill="#f0f6fc">Read the newest version from</text>
<text x="36" y="99" font-size="13.5" fill="#f0f6fc">Jamf&#39;s patch catalogue.</text>
<text x="36" y="119" font-size="12.5" font-style="italic" fill="#9198a1">Already in the policy? Stop here.</text>
<rect x="324" y="20" width="272" height="112" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="350" cy="48" r="12" fill="#4493f8"/>
<text x="350" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text>
<text x="372" y="53" font-size="16" font-weight="700" fill="#f0f6fc">Download</text>
<text x="340" y="80" font-size="13.5" fill="#f0f6fc">Fetch the vendor&#39;s signed pkg</text>
<text x="340" y="99" font-size="13.5" fill="#f0f6fc">once, on the server.</text>
<rect x="628" y="20" width="272" height="112" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="654" cy="48" r="12" fill="#4493f8"/>
<text x="654" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text>
<text x="676" y="53" font-size="16" font-weight="700" fill="#f0f6fc">Verify</text>
<text x="644" y="80" font-size="13.5" fill="#f0f6fc">Size, hash, pkg structure,</text>
<text x="644" y="99" font-size="13.5" fill="#f0f6fc">signing Team ID and version.</text>
<rect x="20" y="168" width="272" height="112" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="46" cy="196" r="12" fill="#4493f8"/>
<text x="46" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text>
<text x="68" y="201" font-size="16" font-weight="700" fill="#f0f6fc">Publish</text>
<text x="36" y="228" font-size="13.5" fill="#f0f6fc">Place it in the distribution</text>
<text x="36" y="247" font-size="13.5" fill="#f0f6fc">point&#39;s Packages/ folder.</text>
<rect x="324" y="168" width="272" height="112" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="350" cy="196" r="12" fill="#4493f8"/>
<text x="350" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text>
<text x="372" y="201" font-size="16" font-weight="700" fill="#f0f6fc">Update Jamf</text>
<text x="340" y="228" font-size="13.5" fill="#f0f6fc">Package record, policy swap,</text>
<text x="340" y="247" font-size="13.5" fill="#f0f6fc">patch title mapping.</text>
<rect x="628" y="168" width="272" height="112" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="654" cy="196" r="12" fill="#3fb950"/>
<text x="654" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text>
<text x="676" y="201" font-size="16" font-weight="700" fill="#56d364">Macs install locally</text>
<text x="644" y="228" font-size="13.5" fill="#f0f6fc">New Macs get it from the LAN,</text>
<text x="644" y="247" font-size="13.5" fill="#f0f6fc">not the internet.</text>
</svg>
