<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The nightly run, per app</title>
<desc id="d">Six steps: check the newest version in Jamf's patch catalogue and stop if the policy already has it; download the vendor's signed pkg once on the server; verify size, hash, pkg structure, signing Team ID and version; publish it to the distribution point's Packages folder; update Jamf with the package record, policy swap and patch title mapping; new Macs then install it from the local network.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<line x1="296" y1="76" x2="320" y2="76" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="76" x2="624" y2="76" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="296" y1="224" x2="320" y2="224" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="224" x2="624" y2="224" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<path d="M764 136 V150 H156 V164" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="20" width="272" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="46" cy="48" r="12" fill="#0969da"/>
<text x="46" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
<text x="68" y="53" font-size="16" font-weight="700" fill="#1f2328">Check</text>
<text x="36" y="80" font-size="13.5" fill="#1f2328">Read the newest version from</text>
<text x="36" y="99" font-size="13.5" fill="#1f2328">Jamf&#39;s patch catalogue.</text>
<text x="36" y="119" font-size="12.5" font-style="italic" fill="#59636e">Already in the policy? Stop here.</text>
<rect x="324" y="20" width="272" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="350" cy="48" r="12" fill="#0969da"/>
<text x="350" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
<text x="372" y="53" font-size="16" font-weight="700" fill="#1f2328">Download</text>
<text x="340" y="80" font-size="13.5" fill="#1f2328">Fetch the vendor&#39;s signed pkg</text>
<text x="340" y="99" font-size="13.5" fill="#1f2328">once, on the server.</text>
<rect x="628" y="20" width="272" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="654" cy="48" r="12" fill="#0969da"/>
<text x="654" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
<text x="676" y="53" font-size="16" font-weight="700" fill="#1f2328">Verify</text>
<text x="644" y="80" font-size="13.5" fill="#1f2328">Size, hash, pkg structure,</text>
<text x="644" y="99" font-size="13.5" fill="#1f2328">signing Team ID and version.</text>
<rect x="20" y="168" width="272" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="46" cy="196" r="12" fill="#0969da"/>
<text x="46" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
<text x="68" y="201" font-size="16" font-weight="700" fill="#1f2328">Publish</text>
<text x="36" y="228" font-size="13.5" fill="#1f2328">Place it in the distribution</text>
<text x="36" y="247" font-size="13.5" fill="#1f2328">point&#39;s Packages/ folder.</text>
<rect x="324" y="168" width="272" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="350" cy="196" r="12" fill="#0969da"/>
<text x="350" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
<text x="372" y="201" font-size="16" font-weight="700" fill="#1f2328">Update Jamf</text>
<text x="340" y="228" font-size="13.5" fill="#1f2328">Package record, policy swap,</text>
<text x="340" y="247" font-size="13.5" fill="#1f2328">patch title mapping.</text>
<rect x="628" y="168" width="272" height="112" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<circle cx="654" cy="196" r="12" fill="#1a7f37"/>
<text x="654" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
<text x="676" y="201" font-size="16" font-weight="700" fill="#116329">Macs install locally</text>
<text x="644" y="228" font-size="13.5" fill="#1f2328">New Macs get it from the LAN,</text>
<text x="644" y="247" font-size="13.5" fill="#1f2328">not the internet.</text>
</svg>
